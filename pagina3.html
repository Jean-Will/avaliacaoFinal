<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição no Exame Prático</title>

    <link rel="stylesheet" href="css/main_styles.css">
</head>
<body>

    <header>
        <div class="header-container">
            <h1>Inscrição no Exame Prático</h1>

            <nav>
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="pagina2.html">Cursos (Tabelas)</a></li>
                    <li><a href="pagina3.html">Inscrição (Formulário)</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>

        <section class="form-container">

            <h2>Dados do Formando</h2>

            <p>
                Preencha o formulário abaixo. Todos os campos possuem validação obrigatória.
            </p>

            <form action="pagina4.html" method="get">

                <div class="form-group">
                    <label for="name">
                        Nome Completo (Mínimo 3 caracteres):
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="nome"
                        placeholder="Digite o seu nome"
                        minlength="3"
                        required>
                </div>

                <div class="form-group">
                    <label for="email">
                        E-mail Institucional:
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="exemplo@escola.pt"
                        required>
                </div>

                <div class="form-group">
                    <label for="age">
                        Idade (Entre 16 e 99 anos):
                    </label>

                    <input
                        type="number"
                        id="age"
                        name="idade"
                        placeholder="Ex: 25"
                        min="16"
                        max="99"
                        required>
                </div>

                <div class="form-group">
                    <label for="module">
                        Módulo em Avaliação:
                    </label>

                    <select id="module" name="modulo" required>
                        <option value="">
                            -- Selecione uma opção --
                        </option>

                        <option value="UC00604 - Construção de Páginas Web">
                            UC00604 - Construção de Páginas Web
                        </option>

                        <option value="UC00601 - Modelação de Dados">
                            UC00601 - Modelação de Dados
                        </option>
                    </select>
                </div>

                <button type="submit" class="btn-voltar">
                    Submeter Inscrição
                </button>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 - UC 0604</p>
    </footer>

</body>
</html>
